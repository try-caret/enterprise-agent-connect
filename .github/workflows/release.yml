name: Release

# A v* tag publishes the server and client packages to npmjs as @arbium/enterprise-agent-connect
# and @arbium/enterprise-agent-connect-client, and the image to
# ghcr.io/try-caret/enterprise-agent-connect.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Version
        run: |
          v=${GITHUB_REF_NAME#v}
          npm pkg set version="$v"
          (cd packages/client && npm pkg set version="$v")
          [[ $v == *-* ]] && echo "DIST_TAG=next" >> "$GITHUB_ENV" || echo "DIST_TAG=latest" >> "$GITHUB_ENV"
      - run: npm run build && npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npx tsc -p packages/client && npm publish ./packages/client --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        run: |
          v=${GITHUB_REF_NAME#v}
          img=ghcr.io/${{ github.repository }}
          tags="$img:$v"
          [[ $v == *-* ]] || tags="$tags,$img:latest"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.TAGS }}
