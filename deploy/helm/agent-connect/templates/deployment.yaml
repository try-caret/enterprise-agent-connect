{{- if not .Values.image.repository }}{{ fail "image.repository is required" }}{{ end }}
{{- if not .Values.image.tag }}{{ fail "image.tag is required" }}{{ end }}
{{- if not .Values.existingSecret }}{{ fail "existingSecret is required" }}{{ end }}
{{- if and .Values.caBundle.configMap .Values.caBundle.secret }}{{ fail "caBundle: set configMap or secret, not both" }}{{ end }}
{{- $ca := or .Values.caBundle.configMap .Values.caBundle.secret }}
{{- if ne (int .Values.replicaCount) 1 }}{{ fail "replicaCount must be 1: Teams run limits are admitted by a single process" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: agent-connect
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-connect
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-connect
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's node user
      containers:
        - name: agent-connect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          env:
            - name: MIGRATE_ON_START
              value: "true"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            {{- with .Values.branding }}
            - name: BRANDING
              value: {{ toJson . | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $ca }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/agent-connect/ca/{{ .Values.caBundle.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /agent-connect/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /agent-connect/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $ca }}
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/agent-connect/ca
              readOnly: true
          {{- end }}
      {{- if $ca }}
      volumes:
        - name: ca-bundle
          {{- if .Values.caBundle.configMap }}
          configMap:
            name: {{ .Values.caBundle.configMap | quote }}
          {{- else }}
          secret:
            secretName: {{ .Values.caBundle.secret | quote }}
          {{- end }}
            items:
              - key: {{ .Values.caBundle.key | quote }}
                path: {{ .Values.caBundle.key | quote }}
      {{- end }}
