# Adds the example legacy orders database (examples/legacy-orders) and its connector. See
# docs/sql-connector.md:
#   docker compose -f docker-compose.yml -f docker-compose.sql-example.yml up --build --wait
services:
  legacy-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example-only
      POSTGRES_DB: erp
    volumes:
      - ../../examples/legacy-orders/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-connect:
    environment:
      CONNECTOR_DIRS: /connectors
    volumes:
      - ../../examples/legacy-orders/connectors:/connectors:ro
    depends_on:
      legacy-db:
        condition: service_healthy
